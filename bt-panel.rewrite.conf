# Custom Blog 伪静态规则（宝塔面板：网站 → 设置 → 伪静态，整体粘贴）
# 勿在此粘贴 location ~ \.php$ { ... } 等 PHP 处理段，宝塔已自带

# 注意：本配置仅适用于根路径部署（/）。
# 如需子目录部署（如 /blog/），请手动调整所有 location 路径。
# 子目录部署示例：location = /blog/config.php { deny all; }

# 敏感文件与内核目录禁止访问（另有文件头 APP_BOOT 守卫双重防护）
location = /config.php { deny all; }
location ^~ /core/ { deny all; }

# 插件/主题/内核的 PHP 禁止执行（静态资源不受影响；~* 大小写不敏感，
# 防 .PHP 等变体绕过；扩展名补全 pht/phps 等可执行伪装；
# 宝塔中该正则可能被其自带 PHP 规则先匹配而失效，靠文件头守卫兜底）
location ~* ^/(plugins|themes|core)/.*\.(php|phtml|phar|pht|phps|php\d)$ { deny all; }

# 语言包目录禁止直接访问（内核经 include 加载，另有 APP_BOOT 守卫）
location ^~ /assets/langs/ { deny all; }

# 上传目录禁止执行 PHP（~* 大小写不敏感；扩展名补全 pht/phps 等可执行伪装）
location ^~ /uploads/ {
    location ~* \.(php|phtml|phar|pht|phps|php\d)$ { deny all; }
}

# Let's Encrypt 等 ACME 证书 HTTP-01 签发/续期豁免（^~ 前缀匹配优先于下方正则隐藏文件规则）
location ^~ /.well-known/ { }

# 禁止访问隐藏文件
location ~ /\. { deny all; }

# 伪静态：非真实文件/目录转前台入口（/install/、/user/ 自动按常规 PHP 处理，无需单列）
location / {
    try_files $uri $uri/ /index.php?r=$uri&$args;
}
